name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config --global user.name ci && git config --global user.email ci@example.test
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: scripts/check-secrets.sh
      - run: python3 scripts/validate-registry.py
      - run: python3 scripts/validate-skills.py
      - run: for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done
      - run: python3 skills/knowledge-placement/scripts/test_knowledge.py
      - run: bash skills/debug-protocol/scripts/test_repro_check.sh
      - run: python3 skills/project-dam/scripts/dam.py check examples/project-dam/PLAN-example.md
      - run: python3 skills/project-dam/scripts/dam.py check skills/project-dam/templates/dam-plan.template.md
      - run: python3 skills/qa-report/scripts/build-report.py check examples/qa-report/qa-results-example.yaml
      - run: python3 skills/qa-report/scripts/build-report.py check skills/qa-report/templates/qa-results.template.yaml
      - run: python3 skills/qa-report/scripts/build-report.py render examples/qa-report/qa-results-example.yaml --out /tmp/qa-check.md && diff /tmp/qa-check.md examples/qa-report/QA-REPORT-example.md
      - run: python3 skills/qa-report/scripts/redact.py --check examples/qa-report/QA-REPORT-example.md
      - run: jq -e . hooks/hooks.json .claude-plugin/plugin.json .claude-plugin/marketplace.json
